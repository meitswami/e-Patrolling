version: '3.9'

# ============================================================
# PATROL — Docker Compose
# All services for local MVP development
# ============================================================

services:

  # ──────────────────────────────────────────────────────
  # PostgreSQL — Primary Database
  # ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: patrol_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patrol_secret}
      POSTGRES_DB: ${POSTGRES_DB:-patrol_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patrol}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - patrol_net

  # ──────────────────────────────────────────────────────
  # Redis — Queue + Cache
  # ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: patrol_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - patrol_net

  # ──────────────────────────────────────────────────────
  # FastAPI Backend
  # ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: patrol_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-patrol}:${POSTGRES_PASSWORD:-patrol_secret}@postgres:5432/${POSTGRES_DB:-patrol_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_in_production_use_openssl_rand_hex_32}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      MODEL_CACHE_DIR: /app/ai_models/cache
      USE_GPU: ${USE_GPU:-false}
      EVIDENCE_STORAGE_PATH: /app/storage/evidence
      SCREENSHOTS_PATH: /app/storage/screenshots
      CRAWLER_HEADLESS: ${CRAWLER_HEADLESS:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_ENABLED: "true"
    volumes:
      - ./storage:/app/storage
      - ./ai_models:/ai_models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - patrol_net

  # ──────────────────────────────────────────────────────
  # AI Worker — Processes abuse detection queue
  # ──────────────────────────────────────────────────────
  ai_worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: patrol_ai_worker
    restart: unless-stopped
    command: ["python", "-c", "import asyncio; from task_queue.consumer import _consumer_loop; asyncio.run(_consumer_loop())"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-patrol}:${POSTGRES_PASSWORD:-patrol_secret}@postgres:5432/${POSTGRES_DB:-patrol_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      MODEL_CACHE_DIR: /app/ai_models/cache
      USE_GPU: ${USE_GPU:-false}
      EVIDENCE_STORAGE_PATH: /app/storage/evidence
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./storage:/app/storage
      - ./ai_models:/ai_models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - patrol_net

  # ──────────────────────────────────────────────────────
  # Crawler Worker — optional (scheduler runs inside API by default)
  # ──────────────────────────────────────────────────────
  crawler_worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: patrol_crawler
    restart: unless-stopped
    command: ["python", "-c", "from task_queue.scheduler import start_scheduler; import asyncio; start_scheduler(); asyncio.get_event_loop().run_forever()"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-patrol}:${POSTGRES_PASSWORD:-patrol_secret}@postgres:5432/${POSTGRES_DB:-patrol_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      CRAWLER_HEADLESS: ${CRAWLER_HEADLESS:-true}
      CRAWLER_TIMEOUT_MS: ${CRAWLER_TIMEOUT_MS:-30000}
      MAX_CONCURRENT_BROWSERS: ${MAX_CONCURRENT_BROWSERS:-3}
      EVIDENCE_STORAGE_PATH: /app/storage/evidence
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - patrol_net

  # ──────────────────────────────────────────────────────
  # Next.js Frontend
  # ──────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: patrol_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      NEXT_PUBLIC_MAP_PROVIDER: openstreetmap
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - patrol_net

  # ──────────────────────────────────────────────────────
  # Nginx — Reverse Proxy (production-like setup)
  # ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: patrol_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage:/app/storage:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - patrol_net
    profiles:
      - production  # Only start with: docker-compose --profile production up

# ──────────────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ──────────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────────
networks:
  patrol_net:
    driver: bridge