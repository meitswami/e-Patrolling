# Shakti — nginx vhost (subdomain only; certbot SSL paths included after first cert issue)
# Static export: dynamic [param] routes serve placeholder shells (/_/) — see route blocks below.

server {
    listen 80;
    server_name shakti.meitcybersolutions.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shakti.meitcybersolutions.com;

    ssl_certificate /etc/letsencrypt/live/shakti.meitcybersolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shakti.meitcybersolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:5100;
    }

    # Evidence screenshots (FastAPI StaticFiles mount at /storage)
    location /storage/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static export — real UUIDs/IDs map to build-time placeholder pages
    location ~ ^/monitoring/target/[^/]+/history/?$ {
        root /var/www/shakti;
        try_files /monitoring/target/_/history/index.html =404;
    }

    location ~ ^/monitoring/log/[^/]+/?$ {
        root /var/www/shakti;
        try_files /monitoring/log/_/index.html =404;
    }

    location ~ ^/evidence/[^/]+/?$ {
        root /var/www/shakti;
        try_files /evidence/_/index.html =404;
    }

    location ~ ^/offenders/dossier/[^/]+/?$ {
        root /var/www/shakti;
        try_files /offenders/dossier/_/index.html =404;
    }

    # Marketing homepage only at /
    location = / {
        root /var/www/shakti;
        try_files /index.html =404;
    }

    location / {
        root /var/www/shakti;
        try_files $uri $uri/ $uri.html =404;
    }
}
