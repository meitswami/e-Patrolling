# Shakti — Hostinger VPS reverse proxy
# Install: sudo cp deploy/nginx-shakti.conf /etc/nginx/sites-available/shakti
#          sudo ln -sf /etc/nginx/sites-available/shakti /etc/nginx/sites-enabled/shakti
#          sudo nginx -t && sudo systemctl reload nginx
#
# DNS (on bojprtest.in account): A record shakti.bojprtest.in → 187.127.185.243
# Optional path deploy: set NEXT_BASE_PATH=/shakti and use the /shakti/ location block below.

# ── Recommended: dedicated subdomain ─────────────────────────────
server {
    listen 80;
    server_name shakti.bojprtest.in;

    client_max_body_size 25M;

    # API + WebSocket
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:5000;
    }

    # Static Next.js export (built to /var/www/shakti)
    location / {
        root /var/www/shakti;
        try_files $uri $uri/ $uri.html /index.html;
    }
}

# ── Optional: path on main domain (bojprtest.in/shakti/) ─────────
