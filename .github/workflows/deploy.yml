name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true

          script: |
            set -e
            cd ~/e-Patrolling

            git fetch origin main
            git reset --hard origin/main

            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            pip install -U pip -q
            pip install -r requirements.txt -q

            # Playwright Chromium (Ubuntu 26.04 needs platform override)
            export PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64
            python -m playwright install chromium 2>/dev/null || true

            # Bootstrap .env (never committed — must exist on EC2)
            if [ ! -f .env ]; then
              cp .env.example .env
              sed -i 's/^ENVIRONMENT=development/ENVIRONMENT=production/' .env
              sed -i 's/^CRAWLER_DEMO_MODE=true/CRAWLER_DEMO_MODE=false/' .env
              echo "Created .env from .env.example — set DATABASE_URL and JWT_SECRET_KEY on the server if deploy used placeholders."
            fi
            if ! grep -q '^ALLOWED_ORIGINS=.*e-patrolling.vercel.app' .env; then
              if grep -q '^ALLOWED_ORIGINS=' .env; then
                sed -i 's|^ALLOWED_ORIGINS=.*|ALLOWED_ORIGINS=https://e-patrolling.vercel.app,http://localhost:3000|' .env
              else
                echo 'ALLOWED_ORIGINS=https://e-patrolling.vercel.app,http://localhost:3000' >> .env
              fi
            fi
            if grep -q '^ENVIRONMENT=development' .env; then
              sed -i 's/^ENVIRONMENT=development/ENVIRONMENT=production/' .env
            fi
            if ! grep -q '^ENVIRONMENT=' .env; then
              echo 'ENVIRONMENT=production' >> .env
            fi
            # Avoid blocking startup on small EC2 (ML preload downloads multi-GB models)
            for key in PRELOAD_AI_MODELS USE_ML_CLASSIFIER USE_INDICBERT; do
              if grep -q "^${key}=true" .env; then
                sed -i "s/^${key}=true/${key}=false/" .env
              fi
            done

            # Optional GitHub repo secrets (Settings → Secrets → Actions)
            if [ -n "${{ secrets.EC2_DATABASE_URL }}" ]; then
              if grep -q '^DATABASE_URL=' .env; then
                sed -i "s|^DATABASE_URL=.*|DATABASE_URL=${{ secrets.EC2_DATABASE_URL }}|" .env
              else
                echo "DATABASE_URL=${{ secrets.EC2_DATABASE_URL }}" >> .env
              fi
            fi
            if [ -n "${{ secrets.EC2_JWT_SECRET }}" ]; then
              if grep -q '^JWT_SECRET_KEY=' .env; then
                sed -i "s|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=${{ secrets.EC2_JWT_SECRET }}|" .env
              else
                echo "JWT_SECRET_KEY=${{ secrets.EC2_JWT_SECRET }}" >> .env
              fi
            fi

            if grep -q 'YOUR-PASSWORD\|change_this' .env; then
              echo "ERROR: .env still has placeholder DATABASE_URL or JWT_SECRET_KEY."
              echo "On EC2 run: nano ~/e-Patrolling/.env"
              echo "Or add GitHub secrets: EC2_DATABASE_URL, EC2_JWT_SECRET"
              exit 1
            fi

            chmod +x scripts/start-backend.sh scripts/ec2-check.sh
            mkdir -p storage/logs

            pm2 delete backend 2>/dev/null || true
            pm2 start ecosystem.config.cjs
            pm2 save

            echo "=== EC2 check ==="
            bash scripts/ec2-check.sh

            echo "=== Health (must pass, retry up to 90s) ==="
            ok=0
            for i in $(seq 1 18); do
              if curl -sf http://127.0.0.1:5000/health >/dev/null; then
                ok=1
                curl -s http://127.0.0.1:5000/health
                echo ""
                break
              fi
              echo "Waiting for backend... attempt $i/18"
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "Backend not responding on :5000 after 90s"
              pm2 logs backend --lines 50 --nostream
              exit 1
            fi

            echo "=== CORS preflight (local) ==="
            curl -sf -X OPTIONS "http://127.0.0.1:5000/api/v1/auth/login" \
              -H "Origin: https://e-patrolling.vercel.app" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: content-type,authorization" \
              -D - -o /dev/null | grep -i access-control || echo "WARN: no CORS headers on OPTIONS"

            echo "Deploy finished OK"
